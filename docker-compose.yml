services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: claimsight
      POSTGRES_PASSWORD: claimsight
      POSTGRES_DB: claimsight
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimsight"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: claimsight
      MINIO_ROOT_PASSWORD: claimsight-dev
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  # Self-hosted tracing. v2 runs on Postgres alone, which keeps the local stack small.
  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://claimsight:claimsight@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-local-only
      SALT: change-me-local-only
      TELEMETRY_ENABLED: "false"
    ports: ["3000:3000"]

volumes:
  pgdata:
  miniodata:
