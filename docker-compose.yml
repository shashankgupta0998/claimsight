services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: claimsight
      POSTGRES_PASSWORD: claimsight
      POSTGRES_DB: claimsight
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimsight"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: claimsight
      MINIO_ROOT_PASSWORD: claimsight-dev
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  # Tracing goes to Langfuse Cloud (keys in .env). The Langfuse SDK here (v3+) needs a v3+
  # server, which self-hosts with ClickHouse, Redis and object storage on top of Postgres;
  # see langfuse.com/self-hosting rather than adding that stack here.

volumes:
  pgdata:
  miniodata:
