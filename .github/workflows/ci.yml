name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Golden set is reproducible from its seed
        run: |
          uv run python scripts/make_fraud_variants.py
          uv run python scripts/generate_claims.py
          git diff --exit-code -- evals/golden
      - name: Run offline eval suite (replay cassettes)
        run: uv run python -m evals.runner --golden evals/golden/claims.jsonl evals/golden/variants.jsonl evals/golden/synthetic.jsonl --out evals/reports/ci.json
      - name: Block merge on eval regression
        run: uv run python -m evals.gate --report evals/reports/ci.json --baseline evals/baseline.json
      - name: Policy-QA retrieval ablation
        run: uv run python -m evals.retrieval_eval --out evals/reports/retrieval.json
      - name: Coverage review routing and caching (cost vs quality)
        run: uv run python -m evals.routing_eval --out evals/reports/routing.json
      - name: Prompt-injection red team (coverage review)
        run: uv run python -m evals.injection_eval --out evals/reports/injection.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-report
          path: |
            evals/reports/ci.json
            evals/reports/retrieval.json

  pgvector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: claimsight
          POSTGRES_PASSWORD: claimsight
          POSTGRES_DB: claimsight
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claimsight"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      CLAIMSIGHT_DATABASE_URL: postgresql://claimsight:claimsight@localhost:5432/claimsight
      CLAIMSIGHT_TEST_DATABASE_URL: postgresql://claimsight:claimsight@localhost:5432/claimsight
      CLAIMSIGHT_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --group dev --extra pg --extra queue
      - name: Integration tests (ingest, HNSW vs exact, full stack parity, checkpointer, queue)
        run: uv run pytest -q -m pg
      - name: Ingest policies and run the ablation on Postgres
        run: |
          uv run python scripts/ingest_policies.py --init-schema
          uv run python -m evals.retrieval_eval --vector-store pgvector --out evals/reports/retrieval-pg.json

  docker:
    # Builds the deploy image and runs it: the API must start from the image alone (no
    # repo, no .env) and decide a golden claim. Nothing is pushed anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: DOCKER_BUILDKIT=1 docker build -t claimsight:ci .
      - name: No secrets or local data in the image
        run: docker run --rm claimsight:ci sh -c 'test ! -e /app/.env && test ! -d /app/data && test ! -d /app/models'
      - name: Start and decide a claim
        run: |
          docker run -d --name api -p 8000:8000 -e CLAIMSIGHT_API_KEY=ci-key claimsight:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          claim=$(python3 -c "import json; print(json.dumps(json.loads(open('evals/golden/claims.jsonl').readline())['claim']))")
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/claims -H 'content-type: application/json' -d "$claim")" = 401
          curl -sf -X POST localhost:8000/claims -H 'content-type: application/json' -H 'X-API-Key: ci-key' -d "$claim" | tee out.json
          python3 -c "import json; d=json.load(open('out.json')); assert d['status'] in ('decided', 'awaiting_review'), d"
      - name: Docker Space image (demo page, no key; HF hosts it only with PRO)
        run: |
          python3 scripts/build_space.py --kind docker
          DOCKER_BUILDKIT=1 docker build -t claimsight:space build/space
          docker run -d --name space -p 8001:8000 claimsight:space
          for i in $(seq 1 30); do curl -sf localhost:8001/healthz && break; sleep 1; done
          curl -sf localhost:8001/ | grep -q "ClaimSight demo"
          test "$(curl -sf localhost:8001/demo/samples | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')" = 17
          claim=$(python3 -c "import json; print(json.dumps(json.loads(open('evals/golden/claims.jsonl').readline())['claim']))")
          curl -sf -X POST localhost:8001/claims -H 'content-type: application/json' -d "$claim" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['status'] in ('decided', 'awaiting_review'), d"
      - name: Container logs
        if: always()
        run: docker logs api || true; docker logs space || true
