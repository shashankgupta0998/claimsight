[project]
name = "claimsight"
version = "0.1.0"
description = "Multimodal, agent-based auto-insurance claims triage with an eval-first harness."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "langgraph>=0.2.60",
    "pillow>=10.4",
]

[project.optional-dependencies]
# Real models (detector, part finder, ASR). Heavy: install only on machines that run inference.
ml = ["torch>=2.4", "transformers>=4.46", "accelerate>=0.34", "timm>=1.0"]
# Hybrid retrieval on Postgres + pgvector.
rag = ["psycopg[binary]>=3.2", "pgvector>=0.3", "sentence-transformers>=3.2", "numpy>=1.26"]
# LLM judge and tracing.
llm = ["anthropic>=0.40", "langfuse>=2.50"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimsight"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
