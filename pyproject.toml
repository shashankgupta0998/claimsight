[project]
name = "claimsight"
version = "0.1.0"
description = "Multimodal, agent-based auto-insurance claims triage with an eval-first harness."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "langgraph>=0.2.60",
    "pillow>=10.4",
]

[project.optional-dependencies]
# Real models (detector, part finder, ASR). Heavy: install only on machines that run inference.
ml = ["torch>=2.4", "transformers>=4.46", "accelerate>=0.34", "timm>=1.0"]
# Fine-tuning the damage detector (scripts/train_detector.py): torchvision for the image
# processor, scipy for the Hungarian matcher, torchmetrics + pycocotools for COCO mAP.
train = ["claimsight[ml]", "torchvision>=0.20", "scipy>=1.13", "torchmetrics>=1.4", "pycocotools>=2.0.8"]
# Redis job queue (claimsight/queue.py): the API enqueues, a worker runs the graph.
queue = ["arq>=0.28"]
# Load testing the API (loadtest/): Locust drives it over HTTP.
load = ["locust>=2.40"]
# Postgres + pgvector client. Light: CI's integration job installs only this.
pg = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2", "pgvector>=0.3", "numpy>=1.26", "langgraph-checkpoint-postgres>=3.2"]
# Embedding model for recording embedding cassettes and live mode. Pulls in torch.
embed = ["sentence-transformers>=3.2"]
rag = ["claimsight[pg,embed]"]
# LLM judge and tracing.
llm = ["anthropic>=0.40", "langfuse>=2.50"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimsight"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["pg: needs Postgres + pgvector (CLAIMSIGHT_TEST_DATABASE_URL); queue tests also CLAIMSIGHT_TEST_REDIS_URL"]
# arq 0.28 calls a deprecated asyncio API and a deprecated redis close; not ours to fix.
filterwarnings = ["ignore::DeprecationWarning:arq.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
